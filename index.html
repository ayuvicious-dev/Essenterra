<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essentera</title>
<meta name="description" content="Hidup berkelanjutan: tanam, ternak, dan kelola energi sendiri dari awal sampai panen dan olah.">
<meta name="theme-color" content="#2f4a35">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essentera">
<style>
:root{
  --moss:#2f4a35; --leaf:#5f8f55; --sage:#a9c49b; --mist:#eef3ea; --paper:#f8faf5;
  --soil:#6b4f3a; --sun:#d4a72c; --water:#4b87a8; --danger:#b3412f;
  --ink:#1f2b22; --ink2:#5a6a5d; --line:#d5e0cd; --card:#ffffff; --bg:#eef3ea;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e6efe2;--ink2:#9fb2a3;--line:#2e4333;--card:#1a2a1f;--bg:#121c15;--paper:#162219;--mist:#1d2e22;--moss:#8fbf82;--leaf:#78ad6b;--sage:#3e5f3f;--soil:#c29a78}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;width:100%}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:.85rem;color:var(--ink2);margin:.8rem 0 .25rem}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.1rem;border-radius:12px;background:var(--moss);color:var(--paper);font-weight:600}
@media (prefers-color-scheme:dark){.btn{color:#10190f}}
.btn.alt{background:transparent;color:var(--moss);border:1.5px solid var(--sage)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{padding:.4rem .75rem;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.5}
.muted{color:var(--ink2);font-size:.9rem}

/* Layout */
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header.top img{width:34px;height:34px}
header.top h1{font-size:1.35rem;flex:1}
header.top .back{font-size:1.5rem;padding:.1rem .6rem;border-radius:8px;color:var(--moss)}
main{flex:1;padding:1rem 1rem 6rem}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav.tabs .in{display:flex;width:100%;max-width:720px}
nav.tabs button{flex:1;padding:.7rem .2rem;font-size:.8rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:.15rem}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--moss);font-weight:700}

/* Login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.4rem;max-width:420px;margin:0 auto}
#login img{width:92px;height:92px;margin-bottom:1rem}
#login h1{font-size:2.4rem}
#login p.lead{margin:.5rem 0 1.5rem;color:var(--ink2)}
.divider{display:flex;align-items:center;gap:.6rem;color:var(--ink2);font-size:.85rem;margin:1rem 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:.88rem;margin-top:.6rem;min-height:1.2em}

/* Home */
.hero{background:var(--moss);color:var(--paper);border-radius:20px;padding:1.2rem 1.2rem 1.3rem;margin-bottom:1.1rem}
@media (prefers-color-scheme:dark){.hero{background:#24402a;color:#e6efe2}}
.hero h2{font-size:1.5rem;margin-bottom:.2rem}
.hero p{opacity:.85;font-size:.92rem}
.stats{display:flex;gap:1.4rem;margin-top:1rem}
.stats b{display:block;font-family:var(--serif);font-size:1.7rem;line-height:1}
.stats span{font-size:.78rem;opacity:.8}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:1.3rem 0 .6rem}
.section-title h3{font-size:1.15rem}
.proj{display:flex;gap:.85rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.85rem;margin-bottom:.7rem;width:100%;text-align:left}
.proj .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;background:var(--mist);flex:none}
.proj .body{flex:1;min-width:0}
.proj .name{font-weight:600}
.proj .sub{font-size:.82rem;color:var(--ink2)}
.bar{height:7px;border-radius:99px;background:var(--mist);margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.chip{display:inline-block;font-size:.75rem;padding:.12rem .55rem;border-radius:99px;background:var(--mist);color:var(--moss);margin-left:.4rem}
.chip.done{background:var(--sun);color:#2b2208}
.empty{text-align:center;padding:2rem 1rem;color:var(--ink2);background:var(--card);border:1px dashed var(--sage);border-radius:16px}

/* Catalog */
.filters{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.6rem}
.filters button{padding:.4rem .9rem;border-radius:99px;border:1.5px solid var(--sage);color:var(--moss);white-space:nowrap;font-size:.88rem}
.filters button.on{background:var(--moss);color:var(--paper);border-color:var(--moss)}
@media (prefers-color-scheme:dark){.filters button.on{color:#10190f}}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem}
.cat h3{font-size:1.1rem;display:flex;gap:.5rem;align-items:center}
.cat p{font-size:.9rem;color:var(--ink2);margin:.35rem 0 .7rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.meta span{font-size:.78rem;background:var(--mist);padding:.15rem .6rem;border-radius:8px;color:var(--ink2)}

/* Detail: batang tumbuh (timeline) */
.dh{margin-bottom:1rem}
.dh h2{font-size:1.6rem}
.dh .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}
.bigprog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1.2rem}
.bigprog .num{font-family:var(--serif);font-size:2.2rem;line-height:1}
.bigprog .bar{height:10px}
.stem{position:relative;margin-left:.5rem;padding-left:2.1rem}
.stem::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.stem .fill{position:absolute;left:11px;top:6px;width:3px;background:var(--leaf);border-radius:3px;transition:height .5s}
.stage{position:relative;margin-bottom:1.1rem}
.stage .node{position:absolute;left:-2.1rem;top:.15rem;width:25px;height:25px;border-radius:50% 50% 50% 4px;background:var(--card);border:3px solid var(--line);transform:rotate(-45deg);display:grid;place-items:center}
.stage.done .node{background:var(--leaf);border-color:var(--leaf)}
.stage.now .node{border-color:var(--leaf);background:var(--sage)}
.stage.harvest .node{border-color:var(--sun)} .stage.harvest.done .node{background:var(--sun);border-color:var(--sun)}
.stage h3{font-size:1.05rem}
.stage .when{font-size:.8rem;color:var(--ink2)}
.stage .desc{font-size:.9rem;color:var(--ink2);margin:.25rem 0 .4rem}
.task{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;font-size:.92rem;cursor:pointer}
.task input{width:20px;height:20px;margin-top:.1rem;accent-color:var(--leaf);padding:0;flex:none}
.task.done span{text-decoration:line-through;color:var(--ink2)}
.stage:not(.now):not(.done) .desc,.stage:not(.now):not(.done) .tasks{opacity:.75}

/* Log */
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;margin-bottom:.6rem}
.log .d{font-size:.78rem;color:var(--ink2);display:flex;justify-content:space-between}
.log img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:.5rem}
.log .t{margin-top:.3rem;white-space:pre-wrap;font-size:.92rem}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:1.2rem 1.1rem calc(1.4rem + env(safe-area-inset-bottom,0px))}
.sheet h3{font-size:1.25rem;margin-bottom:.2rem}
.sheet .actions{display:flex;gap:.6rem;margin-top:1.2rem}
.sheet .actions .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
#toast{position:fixed;left:50%;bottom:5.2rem;transform:translateX(-50%);background:var(--moss);color:var(--paper);padding:.6rem 1rem;border-radius:12px;font-size:.9rem;z-index:30;max-width:90%}
@media (prefers-color-scheme:dark){#toast{color:#10190f}}
.net{font-size:.75rem;padding:.15rem .55rem;border-radius:99px;background:var(--sun);color:#2b2208}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="hidden">
  <img src="icons/logo.png" alt="Logo Essentera">
  <h1>Essentera</h1>
  <p class="lead">Tanam, ternak, dan kelola energi sendiri. Catat langkah demi langkah sampai panen dan olah, supaya hidup makin berdikari.</p>
  <button class="btn" id="btnGoogle">Masuk dengan Google</button>
  <div class="divider">atau pakai email</div>

  <input id="pass" type="password" autocomplete="current-password">
  <div style="display:flex;gap:.6rem;margin-top:1rem">
    <button class="btn" id="btnLogin" style="flex:1">Masuk</button>
    <button class="btn alt" id="btnSignup" style="flex:1">Daftar</button>
  </div>
  <button class="muted" id="btnReset" style="margin-top:.8rem;text-decoration:underline;align-self:flex-start">Lupa kata sandi?</button>
  <div class="err" id="loginErr" role="alert"></div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="top">
    <button class="back hidden" id="btnBack" aria-label="Kembali">‹</button>
    <img src="icons/logo.png" alt="" id="topLogo">
    <h1 id="topTitle">Essentera</h1>
    <span class="net hidden" id="netBadge">Offline</span>

  <main id="view"></main>
  <nav class="tabs"><div class="in">

    <button data-tab="account"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Akun</button>
  </div></nav>
</div>
<div id="modalRoot"></div>
<div id="toast" class="hidden" role="status"></div>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const DAY = 86400000;
const today = () => new Date().toISOString().slice(0, 10);
const daysSince = iso => Math.floor((Date.now() - new Date(iso + "T00:00:00").getTime()) / DAY);
const fmtDate = iso => new Date(iso + "T00:00:00").toLocaleDateString("id-ID", { day:"numeric", month:"short", year:"numeric" });
const addDays = (iso, n) => { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), 2600); }
const errMsg = e => ({
  "auth/invalid-credential":"Email atau kata sandi salah.","auth/invalid-email":"Format email tidak valid.",
  "auth/email-already-in-use":"Email sudah terdaftar. Silakan masuk.","auth/weak-password":"Kata sandi minimal 6 karakter.",
  "auth/popup-closed-by-user":"Jendela masuk ditutup.","auth/network-request-failed":"Tidak ada koneksi internet.",
  "auth/unauthorized-domain":"Domain ini belum diizinkan di Firebase (Authentication > Settings > Authorized domains).",
  "auth/operation-not-allowed":"Metode masuk ini belum diaktifkan di Firebase Console.","auth/too-many-requests":"Terlalu banyak percobaan. Coba lagi nanti.",
  "permission-denied":"Akses ditolak. Periksa Firestore Rules di Firebase Console."
}[e?.code] || e?.message || "Terjadi kesalahan.");

function progressOf(p){
  const tpl = byId(p.tplId); const stages = p.stages || tpl?.stages || [];
  const total = stages.reduce((n, s) => n + s.t.length, 0);
  const done = Object.values(p.done || {}).filter(Boolean).length;
  const pct = total ? Math.round(done / total * 100) : 0;
  return { total, done, pct: p.completed ? 100 : pct };
}
function currentStage(p){
  const stages = p.stages || byId(p.tplId)?.stages || [];
  const d = Math.max(0, daysSince(p.startDate));
  let idx = 0; stages.forEach((s, i) => { if (d >= s.day) idx = i; });
  return idx;
}

function watchLogs(pid){
  if (logs[pid]?.unsub) return;
  logs[pid] = { items: [], unsub: null };
  const q = query(collection(db, "users", user.uid, "projects", pid, "logs"), orderBy("date", "desc"));
  logs[pid].unsub = onSnapshot(q, snap => { logs[pid].items = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (openId === pid) render(); });

/* Foto: kompres di perangkat. Utamanya ke Firebase Storage; jika Storage belum aktif, jatuh ke versi kecil di Firestore. */
function compress(file, max, quality){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Gagal memproses foto.")), "image/jpeg", quality);
    };
    img.onerror = () => rej(new Error("File bukan gambar yang valid.")); img.src = url;
  });
}
const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

    <label for="lF">Foto (opsional)</label><input id="lF" type="file" accept="image/*" capture="environment">
    <div class="actions"><button class="btn alt" id="x">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  s.querySelector("#x").onclick = closeSheet;
  s.querySelector("#ok").onclick = async (ev) => {

    if (!text && !file) { toast("Isi catatan atau pilih foto."); return; }
    ev.target.disabled = true; ev.target.textContent = "Menyimpan…";
    const data = { date: s.querySelector("#lD").value || today(), text, createdAt: serverTimestamp() };
    try {
      if (file) {
        const blob = await compress(file, 1280, 0.78);
        const path = `users/${user.uid}/${p.id}/${Date.now()}.jpg`;
        try {
          await uploadBytes(sRef(storage, path), blob, { contentType: "image/jpeg" });
          data.photo = await getDownloadURL(sRef(storage, path)); data.photoPath = path;
        } catch (se) {
          if (!navigator.onLine) throw new Error("Foto butuh koneksi internet untuk diunggah.");
          const small = await compress(file, 640, 0.6); data.photo = await blobToDataUrl(small);
          toast("Storage belum aktif, foto disimpan dalam ukuran kecil.");
        }
      }
      await addDoc(collection(db, "users", user.uid, "projects", p.id, "logs"), data);
      closeSheet(); toast("Catatan disimpan.");
    } catch(e){ toast(errMsg(e)); ev.target.disabled = false; ev.target.textContent = "Simpan"; }
  };
}
