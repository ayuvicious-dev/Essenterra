<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Essentera</title>
<meta name="description" content="Hidup berkelanjutan: tanam, ternak, dan kelola energi sendiri dari awal sampai panen dan olah.">
<meta name="theme-color" content="#2f4a35">
<script>try{var _t=localStorage.getItem("essentera-theme");if(_t)document.documentElement.setAttribute("data-theme",_t);var _f=parseInt(localStorage.getItem("essentera-fs"),10);if(_f>=80&&_f<=150)document.documentElement.style.fontSize=_f+"%"}catch(e){}</script>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" id="favicon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essentera">
<style>
:root{
  --moss:#2f4a35; --leaf:#5f8f55; --sage:#a9c49b; --mist:#eef3ea; --paper:#f8faf5;
  --soil:#6b4f3a; --sun:#d4a72c; --water:#4b87a8; --danger:#b3412f;
  --ink:#1f2b22; --ink2:#5a6a5d; --line:#d5e0cd; --card:#ffffff; --bg:#eef3ea;
  --btntext:#f8faf5; --herobg:#d8e9ce; --herofg:#2f4a35; --tile:rgba(255,255,255,.55);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#e6efe2;--ink2:#9fb2a3;--line:#2e4333;--card:#1a2a1f;--bg:#121c15;--paper:#162219;--mist:#1d2e22;--moss:#8fbf82;--leaf:#78ad6b;--sage:#3e5f3f;--soil:#c29a78;--btntext:#10190f;--herobg:#2b4631;--herofg:#e6efe2;--tile:rgba(255,255,255,.08);color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#e6efe2;--ink2:#9fb2a3;--line:#2e4333;--card:#1a2a1f;--bg:#121c15;--paper:#162219;--mist:#1d2e22;--moss:#8fbf82;--leaf:#78ad6b;--sage:#3e5f3f;--soil:#c29a78;--btntext:#10190f;--herobg:#2b4631;--herofg:#e6efe2;--tile:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;width:100%}
textarea{resize:vertical;min-height:84px}
label{display:block;font-size:.85rem;color:var(--ink2);margin:.8rem 0 .25rem}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.1rem;border-radius:12px;background:var(--moss);color:var(--btntext);font-weight:600}
.btn.alt{background:transparent;color:var(--moss);border:1.5px solid var(--sage)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.small{padding:.4rem .75rem;font-size:.85rem;border-radius:9px}
.btn:disabled{opacity:.5}
.muted{color:var(--ink2);font-size:.9rem}

/* Layout */
#app{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:.7rem;padding:.9rem 1rem;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
header.top img{width:34px;height:34px}
header.top h1{font-size:1.35rem;flex:1}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:.7rem 0 .5rem}
.cal-head h3{font-size:1.15rem;text-align:center;flex:1}
.cal-nav{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--sage);color:var(--moss);font-size:1.3rem;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal-dow{font-size:.72rem;color:var(--ink2);padding:.2rem 0}
.cal-day{aspect-ratio:1/1;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:.92rem}
.cal-day:hover{background:var(--mist)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--leaf);font-weight:700}
.cal-day.has-est{background:var(--sage);font-weight:700}
.cal-day.has-act{background:var(--sun);color:#2b2208;font-weight:700}
.cal-day.has-est.has-act{background:var(--sun);color:#2b2208;box-shadow:inset 0 0 0 3px var(--leaf)}
.cal-day.sel{outline:2.5px solid var(--moss);outline-offset:1px;font-weight:700}
.cal-day.sel:not(.has-est):not(.has-act){background:var(--mist)}
.cal-legend{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem 1.1rem;font-size:.78rem;color:var(--ink2);margin:.8rem 0 .2rem}
.cal-legend span{display:inline-flex;align-items:center;gap:.4rem}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;box-sizing:border-box}
.sw.est{background:var(--sage)} .sw.act{background:var(--sun)} .sw.both{background:var(--sun);box-shadow:inset 0 0 0 2.5px var(--leaf)}
.projrow{display:flex;gap:.5rem;margin-bottom:.7rem}
.projrow .proj{margin-bottom:0;flex:1;min-width:0;width:auto}
.projdel{flex:none;width:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--danger);display:grid;place-items:center}
.projdel:hover{background:var(--mist)}
.proj .tot{text-align:right;flex:none}
.tot b{display:block;font-family:var(--serif);font-size:1.3rem;line-height:1}
.tot span{font-size:.75rem;color:var(--ink2)}
.fs-preview{margin-top:.8rem;padding:.7rem .8rem;background:var(--mist);border:1px solid var(--line);border-radius:12px;font-size:1rem}
.about{display:flex;gap:.6rem;flex-wrap:wrap}
.about div{flex:1;min-width:8rem;background:var(--mist);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem}
.about span{display:block;font-size:.78rem;color:var(--ink2)}
.about b{font-family:var(--serif);font-size:1.05rem}
.seg{display:flex;gap:.4rem;flex-wrap:wrap}
.seg button{flex:1;min-width:6.5rem;padding:.6rem .5rem;border-radius:10px;border:1.5px solid var(--sage);color:var(--moss);font-size:.9rem}
.seg button.on{background:var(--moss);color:var(--btntext);border-color:var(--moss);font-weight:600}
.themebtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--moss);flex:none}
.themebtn:hover{background:var(--mist)}
.themebtn svg{width:22px;height:22px}
header.top .back{font-size:1.5rem;padding:.1rem .6rem;border-radius:8px;color:var(--moss)}
main{flex:1;padding:1rem 1rem 7.8rem}
nav.tabs{position:fixed;bottom:0;left:0;right:0;padding:0 .75rem calc(.6rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:6;pointer-events:none}
nav.tabs .in{pointer-events:auto;display:flex;align-items:center;width:100%;max-width:720px;height:66px;padding:0 .35rem;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 8px 28px rgba(31,43,34,.16),0 2px 6px rgba(31,43,34,.08)}
nav.tabs button{flex:1;min-width:0;height:calc(100% - .7rem);margin:0 .1rem;border-radius:18px;font-size:.72rem;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;transition:background .2s,color .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--moss);font-weight:700;background:var(--herobg)}
nav.tabs button.fab{background:none;overflow:visible}
nav.tabs button.fab svg{width:58px;height:58px;padding:16px;border-radius:50%;background:var(--moss);color:var(--btntext);transform:translateY(-20px);box-shadow:0 8px 18px rgba(31,43,34,.3);border:4px solid var(--card);box-sizing:border-box;transition:transform .15s}
nav.tabs button.fab:active svg{transform:translateY(-18px) scale(.94)}
nav.tabs button.fab span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:640px){
  nav.tabs{padding:0}
  nav.tabs .in{max-width:none;height:calc(66px + env(safe-area-inset-bottom,0px));padding:0 .35rem env(safe-area-inset-bottom,0px);border-radius:20px 20px 0 0;border-width:1px 0 0;box-shadow:0 -4px 20px rgba(31,43,34,.14)}
}

/* Login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.4rem;max-width:420px;margin:0 auto}
#login img{width:56px;height:56px;margin:0 auto .6rem;align-self:center}
#login h1{font-size:2.4rem;text-align:center;margin-bottom:1.6rem}
.divider{display:flex;align-items:center;gap:.6rem;color:var(--ink2);font-size:.85rem;margin:1rem 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:.88rem;margin-top:.6rem;min-height:1.2em}

/* Home */
.hero{background:var(--herobg);color:var(--herofg);border-radius:20px;padding:1.4rem 1rem 1rem;margin-bottom:1.2rem;text-align:center}
.hero h2{font-size:1.5rem;margin-bottom:.25rem}
.hero p{opacity:.85;font-size:.92rem;max-width:32ch;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.2rem}
.stats div{background:var(--tile);border-radius:14px;padding:.8rem .3rem .7rem}
.stats b{display:block;font-family:var(--serif);font-size:1.8rem;line-height:1;margin-bottom:.3rem}
.stats span{display:block;font-size:.78rem;opacity:.85;line-height:1.25}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:1.3rem 0 .6rem}
.section-title h3{font-size:1.15rem}
.proj{display:flex;gap:.85rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.85rem;margin-bottom:.7rem;width:100%;text-align:left}
.proj .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--mist);border:1px solid var(--line);color:var(--moss);flex:none}
.ic{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;background:var(--mist);color:var(--moss);border:1px solid var(--line);flex:none}
.ico.sm .ic{width:20px;height:20px}
.proj .body{flex:1;min-width:0}
.proj .name{font-weight:600}
.proj .sub{font-size:.82rem;color:var(--ink2)}
.bar{height:7px;border-radius:99px;background:var(--mist);margin-top:.5rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.chip{display:inline-block;font-size:.75rem;padding:.12rem .55rem;border-radius:99px;background:var(--mist);color:var(--moss);margin-left:.4rem}
.chip.done{background:var(--sun);color:#2b2208}
.empty{text-align:center;padding:2rem 1rem;color:var(--ink2);background:var(--card);border:1px dashed var(--sage);border-radius:16px}

/* Catalog */
.filters{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.6rem}
.filters button{padding:.4rem .9rem;border-radius:99px;border:1.5px solid var(--sage);color:var(--moss);white-space:nowrap;font-size:.88rem}
.filters button.addcat{border-style:dashed}
.filters button,.filterbar button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.filterbar .catedwrap{flex:none;display:inline-flex;align-items:center;border:1.5px solid var(--moss);border-radius:99px;background:var(--paper);padding-right:.2rem}
.filterbar input.catedit{flex:none;padding:.4rem .2rem .4rem .9rem;border:0;border-radius:99px;font-size:.88rem;background:transparent;outline:none}
.filterbar button.catdel{padding:0;border:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--danger);flex:none}
.filterbar button.catdel:active{background:var(--mist)}
.filterbar button.catdel svg{width:16px;height:16px}
.filters button[data-f]{transition:transform .15s}
.filters button.dragging{transition:none;position:relative;z-index:3;box-shadow:0 4px 12px rgba(31,43,34,.25);background:var(--herobg)}
.filterbar{display:flex;align-items:flex-start;gap:.5rem;margin-bottom:.5rem}
.filterbar .fixgrp{display:flex;gap:.5rem;flex:none}
.catbar .filterbar .filters{flex:1;min-width:0;margin-bottom:0}
.filterbar .fixgrp button[data-f="all"]{padding:.4rem;display:grid;place-items:center;border-radius:99px;border:1.5px solid var(--sage);color:var(--moss);white-space:nowrap;font-size:.88rem}
.filterbar .fixgrp button[data-f="all"] svg{width:22px;height:22px}
.filterbar .fixgrp button[data-f="all"].on{background:var(--moss);color:var(--btntext);border-color:var(--moss)}
.filterbar .fixgrp button.starf{padding:.4rem;display:grid;place-items:center;border-radius:99px;border:1.5px solid var(--sage);color:var(--moss);position:relative}
.filterbar .fixgrp button.starf svg{width:22px;height:22px}
.filterbar .fixgrp button.starf.on{background:var(--moss);color:var(--btntext);border-color:var(--moss)}
.filterbar .fixgrp button.starf.done svg{fill:currentColor}
.starinfo{font-size:.8rem;color:var(--ink2);margin:.1rem .2rem .5rem}
.filters button.on{background:var(--moss);color:var(--btntext);border-color:var(--moss)}
.catbar{position:sticky;top:calc(var(--hdr,70px) - 1px);z-index:4;background:var(--bg);margin:-.35rem -1rem .5rem;padding:.35rem 1rem .05rem}
.catbar .filters{margin-bottom:.5rem}
.catbar .searchbox{margin:0 0 .6rem}
.searchbox{position:relative;margin:.1rem 0 .9rem}
.searchbox>svg{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--ink2);pointer-events:none}
.searchbox input{padding:.65rem 2.6rem .65rem 2.5rem;border-radius:12px;-webkit-appearance:none;appearance:none}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.searchbox .sclear{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.searchbox .sclear svg{width:16px;height:16px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.8rem}
.cat h3{font-size:1.1rem;display:flex;gap:.5rem;align-items:center}
.cat-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.cat-actions{gap:.1rem;align-items:center;margin-top:-.2rem}
.btn.icon,.btn.icon.alt{width:34px;height:34px;padding:0;background:none;border:0;border-radius:50%;color:var(--ink2);position:relative}
.btn.icon svg{width:19px;height:19px}
.btn.icon:first-child{color:var(--moss);margin-right:.45rem;position:relative}
.btn.icon:first-child::before{content:"";position:absolute;right:-.3rem;top:9px;bottom:9px;width:1px;background:var(--line)}
.btn.icon:active{background:var(--mist)}
.cat-actions .btn.icon[aria-expanded="true"]{color:var(--moss);background:var(--mist);border:0}
.cat-actions .btn.icon[aria-expanded="true"]::after{content:none}
.ctitle{display:flex;align-items:center;gap:.5rem;flex:1;min-width:0;text-align:left;font:inherit;border-radius:10px}
.chev{width:20px;height:20px;color:var(--ink2);transition:transform .2s;flex:none}
.chevbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink2)}
.chevbtn:active{background:var(--mist)}
.fullbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--ink2)}
.fullbtn:active{background:var(--mist)}.fullbtn svg{width:20px;height:20px}
/* Layar penuh: hanya informasi panduan, tanpa tombol fitur lain */
.fullview{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
.fullview .fvbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:.6rem;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(.7rem + env(safe-area-inset-top,0px)) 1rem .7rem}
.fullview .fvbar h2{flex:1;min-width:0;font-family:var(--serif);font-size:1.15rem;display:flex;align-items:center;gap:.5rem}
.fullview .fvbar h2 span:last-child{overflow:hidden;text-overflow:ellipsis}
.fullview .fvx{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.fullview .fvx:active{background:var(--mist)}.fullview .fvx svg{width:22px;height:22px}
.fullview .fvbody{max-width:720px;margin:0 auto;padding:.2rem 1rem calc(2rem + env(safe-area-inset-bottom,0px))}
.fullview .fvphoto{display:block;width:33.333%;min-width:120px;max-width:100%;height:auto;object-fit:contain;border-radius:14px;border:1px solid var(--line);background:var(--mist);margin:.9rem auto 0}
.fullview .meta{margin:.9rem 0 .2rem}
.cat h3 .dupbtn{margin-left:auto}
.cat h3 .gnameedit{flex:1;min-width:0;width:auto;font:inherit;letter-spacing:inherit;line-height:inherit;color:inherit;padding:.2rem .3rem;margin:-.2rem -.3rem;border:0;border-radius:0;background:transparent;outline:none;overflow:visible}
.cat.open .chev{transform:rotate(180deg)}
.cat .cat-tools{display:flex;align-items:center;gap:.3rem;margin:.4rem 0 0}
.gsteps{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}
.gtools{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}
.gtools h4{font-family:var(--serif);font-size:1rem;margin-bottom:.5rem}
.gtools ul{list-style:none;font-size:.88rem}
.gtools li{display:flex;gap:.6rem;align-items:flex-start;margin:.35rem 0}
.gtools li::before{content:"";flex:none;width:8px;height:8px;margin-top:.5em;border-radius:3px;background:var(--leaf)}
.gtools .bn{flex:1;min-width:0;display:flex;flex-direction:column}
.gtools .bn small{color:var(--ink2);font-size:.78rem}
.gtools li b{font-size:.85rem;font-weight:600;white-space:nowrap;margin-left:auto}
.gbahan li{margin:.5rem 0}
.btable-wrap{overflow-x:auto;margin:0 -.2rem}
.btable{width:100%;border-collapse:collapse;font-size:.8rem}
.btable th{font-weight:600;color:var(--ink2);text-align:left;padding:.35rem .4rem;border-bottom:1.5px solid var(--line);white-space:nowrap}
.btable td{padding:.5rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.btable .num{text-align:right;white-space:nowrap}
.btable th.num{text-align:right}
.btable tfoot td{font-weight:700;color:var(--moss);border-bottom:0;padding-top:.65rem}
.btotal{display:flex;justify-content:space-between;gap:.5rem;margin-top:.7rem;padding-top:.6rem;border-top:1px dashed var(--line);font-size:.92rem}
.btotal b{color:var(--moss)}
.three{display:grid;grid-template-columns:1.2fr .7fr 1.2fr;gap:.5rem}
.rowtotal{margin-top:.55rem;font-size:.85rem;color:var(--ink2)}
.rowtotal b{color:var(--moss)}
.pacts{display:flex;gap:.1rem;flex:none}
.pedit.ok{color:var(--moss)}
.pedit.x{color:var(--danger)}
.gtools .hint,.gsteps .hint{font-size:.78rem;margin:0 0 .6rem}
.inrow{display:flex;gap:.3rem;align-items:center;margin-bottom:.4rem}
.krow{transition:transform .15s;background:var(--paper)}
.krow.drag{position:relative;z-index:3;transition:none;box-shadow:0 6px 18px rgba(31,43,34,.25);border-radius:10px}
.grip{width:30px;height:36px;display:grid;place-items:center;color:var(--ink2);touch-action:none;cursor:grab;flex:none;border-radius:8px}
.grip svg{width:18px;height:18px}
.grip:active{background:var(--mist)}
.inrow input{flex:1;min-width:0;padding:.45rem .6rem;font-size:.88rem;border-radius:9px}
.btable.pred td:first-child{color:var(--ink2)}
.predsum{font-size:.85rem;margin-top:.7rem;color:var(--ink2)}.predsum b{color:var(--moss)}
.btable.edit{min-width:560px;table-layout:fixed}
.btable.edit td{vertical-align:middle;padding:.3rem .25rem}
.btable.edit input{width:100%;min-width:0;padding:.4rem .45rem;font-size:.8rem;border-radius:8px}
.btable.edit .rt{font-size:.8rem}
.btable.edit .pedit{width:28px;height:28px}
.gstep{display:flex;gap:.75rem;margin-bottom:1rem}
.gstep:last-child{margin-bottom:0}
.gnum{flex:none;width:28px;height:28px;border-radius:50%;background:var(--mist);border:1px solid var(--line);color:var(--moss);font-size:.82rem;font-weight:700;display:grid;place-items:center}
.gnum.h{background:var(--sun);border-color:var(--sun);color:#2b2208}
.gbody{flex:1;min-width:0}
.gbody h4{font-family:var(--serif);font-size:1rem}
.gbody .when{font-size:.78rem;color:var(--ink2)}
.gstep .gbody p{margin:.3rem 0 .4rem;font-size:.88rem}
.gbody ul{margin-left:1.1rem;font-size:.88rem}
.gbody li{margin:.15rem 0}
.media{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 0}
.media button{font-size:.78rem;background:var(--mist);padding:.15rem .6rem;border-radius:8px;color:var(--ink2);touch-action:manipulation}
.media button.on{background:var(--moss);color:var(--btntext);font-weight:600}
.cat p{font-size:.9rem;color:var(--ink2);margin:.35rem 0 .7rem}
.meta{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0}
.meta button.catchip{font-size:.78rem;background:var(--moss);color:var(--btntext);padding:.15rem .6rem;border-radius:8px;font-weight:600}
.meta span{font-size:.78rem;background:var(--mist);padding:.15rem .6rem;border-radius:8px;color:var(--ink2)}

/* Detail: batang tumbuh (timeline) */
.dh{margin-bottom:1rem}
.dh h2{font-size:1.6rem;display:flex;align-items:center;gap:.6rem}
.dh .row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-top:.3rem}
.bigprog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1.2rem}
.bigprog .num{font-family:var(--serif);font-size:2.2rem;line-height:1}
.bigprog .bar{height:10px}
.stem{position:relative;margin-left:.5rem;padding-left:2.1rem}
.stem::before{content:"";position:absolute;left:11px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:3px}
.stem .fill{position:absolute;left:11px;top:6px;width:3px;background:var(--leaf);border-radius:3px;transition:height .5s}
.stage{position:relative;margin-bottom:1.1rem}
.stage .node{position:absolute;left:-2.1rem;top:.15rem;width:25px;height:25px;border-radius:50% 50% 50% 4px;background:var(--card);border:3px solid var(--line);transform:rotate(-45deg);display:grid;place-items:center}
.stage.done .node{background:var(--leaf);border-color:var(--leaf)}
.stage.now .node{border-color:var(--leaf);background:var(--sage)}
.stage.harvest .node{border-color:var(--sun)} .stage.harvest.done .node{background:var(--sun);border-color:var(--sun)}
.stage h3{font-size:1.05rem}
.stage .when{font-size:.8rem;color:var(--ink2)}
.stage .desc{font-size:.9rem;color:var(--ink2);margin:.25rem 0 .4rem}
.task{display:flex;gap:.6rem;align-items:flex-start;padding:.35rem 0;font-size:.92rem;cursor:pointer}
.task input{width:20px;height:20px;margin-top:.1rem;accent-color:var(--leaf);padding:0;flex:none}
.task.done span{text-decoration:line-through;color:var(--ink2)}
.stage:not(.now):not(.done) .desc,.stage:not(.now):not(.done) .tasks{opacity:.75}

/* Log */
.log{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem;margin-bottom:.6rem}
.log .d{font-size:.78rem;color:var(--ink2);display:flex;justify-content:space-between}
.log img{width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-top:.5rem}
.log .t{margin-top:.3rem;white-space:pre-wrap;font-size:.92rem}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,12,.55);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:calc(100vh - 2rem - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-radius:22px;padding:1.3rem 1.2rem 1.4rem;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.phead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-bottom:.5rem}
.phead h4{font-family:var(--serif);font-size:1rem;margin:0}
.pedit{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);flex:none}
.pedit:active{background:var(--mist)}
.pedit svg{width:17px;height:17px}
.gtools .empty,.gsteps .empty{font-size:.88rem;color:var(--ink2)}
.edstep{border:1px solid var(--line);border-radius:14px;padding:.4rem .8rem .9rem;margin-top:.8rem;background:var(--card)}
.edhead{display:flex;align-items:center;justify-content:space-between;margin-top:.4rem}
.edhead b{font-family:var(--serif);color:var(--moss)}
.edtools button{width:30px;height:30px;border-radius:50%;color:var(--ink2);font-size:1rem;line-height:1}
.edtools button:active{background:var(--mist)}
.edtools button.x{color:var(--danger)}
.sheet h3{font-size:1.25rem;margin-bottom:.2rem}
.sheet .actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
.sheet .actions .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
#toast{position:fixed;left:50%;bottom:6.8rem;transform:translateX(-50%);background:var(--moss);color:var(--btntext);padding:.6rem 1rem;border-radius:12px;font-size:.9rem;z-index:30;max-width:90%}
.net{font-size:.75rem;padding:.15rem .55rem;border-radius:99px;background:var(--sun);color:#2b2208}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Analisis */
.ana-sub{margin-bottom:1rem}
.ana-sub button{min-width:0;flex:1 1 auto;font-size:.82rem;padding:.55rem .4rem}
.ana-q{margin-bottom:.9rem}.ana-q>b{display:block;font-size:.9rem;margin-bottom:.35rem}
.ana-q .seg button{min-width:0;flex:1 1 auto;font-size:.82rem;padding:.5rem .6rem}
.ana-tips{padding-left:1.1rem;font-size:.9rem}.ana-tips li{margin:.35rem 0}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media (max-width:520px){.swot{grid-template-columns:1fr}}
.swot .q{background:var(--card);border:1px solid var(--line);border-top-width:4px;border-radius:16px;padding:.85rem;min-width:0}
.swot .q.s{border-top-color:var(--leaf)}.swot .q.w{border-top-color:var(--sun)}.swot .q.o{border-top-color:var(--water)}.swot .q.t{border-top-color:var(--danger)}
.swot h4{font-family:var(--serif);font-size:1.02rem}
.swot ul{margin-top:.4rem}.swot li{list-style:none;display:flex;gap:.4rem;align-items:flex-start;font-size:.88rem;padding:.3rem 0;border-bottom:1px dashed var(--line)}
.swot li button{margin-left:auto;color:var(--danger);flex:none;padding:0 .35rem;font-size:1.1rem;line-height:1}
.swot .add{display:flex;gap:.4rem;margin-top:.5rem}.swot .add input{padding:.5rem .6rem;font-size:.88rem}
.sug{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.sug button{font-size:.75rem;padding:.25rem .6rem;border-radius:99px;border:1px dashed var(--sage);color:var(--ink2);text-align:left}
.lay-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}.lay-grid.c3{grid-template-columns:repeat(3,1fr)}
.lay-res{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.2rem 0 .8rem}
.lay-res div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.65rem .3rem;text-align:center}
.lay-res b{display:block;font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.lay-res span{font-size:.72rem;color:var(--ink2)}
.lay-svg{display:block;width:100%;height:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.warn{background:rgba(212,167,44,.15);border-left:4px solid var(--sun);padding:.55rem .75rem;border-radius:8px;font-size:.86rem;margin:.4rem 0}

/* Pin rencana tanam */
.cat h3 .pinbtn{margin-left:auto}.cat h3 .pinbtn + .dupbtn{margin-left:0}
.btn.icon.pinbtn.on{color:var(--sun)}.btn.icon.pinbtn.on svg{fill:currentColor}
/* Bintang: panduan sudah dicek kesesuaiannya */
.cat h3 .starbtn{margin-left:auto}.cat h3 .starbtn + .pinbtn{margin-left:0}
.btn.icon.starbtn.on{color:var(--moss)}.btn.icon.starbtn.on svg{fill:currentColor}
.cat[data-id]{scroll-margin-top:150px}
.pinrow .proj{border-left:4px solid var(--sun)}
.pinrow .btn{flex:none;margin-left:.5rem}
.pinpanel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:.8rem 1rem 1rem;margin:-.3rem 0 .8rem}
.pinpanel .media{margin:0 0 .75rem}
.pinpanel .cat-actions{margin-top:0;gap:.5rem;padding:.1rem 0 .15rem}
.pinpanel .cat-actions .btn.icon:first-child:not([aria-expanded="true"]){color:var(--ink2)}
.pinpanel .cat-actions .btn.icon:first-child{margin-right:0}
.pinpanel .cat-actions .btn.icon.pinplay:first-child:not([aria-expanded="true"]){color:var(--moss)}
.pinpanel .cat-actions .btn.icon:first-child::before{display:none}
.pinpanel .gtools,.pinpanel .gsteps{margin-top:.9rem;padding-top:.9rem}
.pinoff{flex:none;width:38px;height:38px;display:grid;place-items:center;color:var(--sun);margin-left:.2rem;border-radius:50%}
.pinoff svg{width:20px;height:20px;fill:currentColor}.pinoff:active{background:var(--mist)}

/* Foto panduan */
.gphoto{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}
.proj .ico{overflow:hidden}
.proj .ico img{width:100%;height:100%;object-fit:cover;display:block}
.gphoto{text-align:center}
.gphoto img{display:block;width:33.333%;min-width:110px;height:auto;margin:0 auto .6rem;border-radius:12px;border:1px solid var(--line);background:var(--mist)}
.gphoto .empty{font-size:.88rem}

/* Periode panen */
.gharvest{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem}
.gharvest h4{font-family:var(--serif);font-size:1rem;margin:0}
.gharvest .hint{font-size:.78rem;margin:0 0 .6rem}
.gharvest .empty{font-size:.88rem}
.gharvest .hvadd{display:flex;gap:.5rem;align-items:flex-end;margin-top:.8rem}
.gharvest .hvadd>div{flex:1;min-width:0}
.gharvest .hvadd label{margin:0 0 .2rem;font-size:.75rem}
.gharvest .hvadd .btn{flex:none}
.gharvest .btable td.d{color:var(--ink2);font-size:.75rem}
</style>
</head>

function harvestEvents(){
  const ev = {}; const add = (d, o) => (ev[d] = ev[d] || []).push(o);
  projects.forEach(p => {
    const stages = p.stages || byId(p.tplId)?.stages || [];
    if (!p.completed) stages.forEach(s => { if (s.type === "harvest") add(addDays(p.startDate, s.day), { kind: "est", p, label: "Estimasi panen" }); });
    (p.harvest || []).forEach(h => add(h.date, { kind: "act", p, label: "Panen " + h.qty + " " + (p.unit || "") }));
  });
  return ev;
}
function calSheet(y = new Date().getFullYear(), m = new Date().getMonth(), sel = null){
  const ev = harvestEvents(), pad = n => String(n).padStart(2, "0");
  const startOffset = (new Date(y, m, 1).getDay() + 6) % 7, dim = new Date(y, m + 1, 0).getDate(), tdy = today();
  let cells = "";
  for (let i = 0; i < startOffset; i++) cells += "<div></div>";
  for (let d = 1; d <= dim; d++) {
    const k = `${y}-${pad(m + 1)}-${pad(d)}`, list = ev[k] || [];
    const est = list.some(e => e.kind === "est"), act = list.some(e => e.kind === "act");
    cells += `<button class="cal-day${est ? " has-est" : ""}${act ? " has-act" : ""}${k === tdy ? " today" : ""}${k === sel ? " sel" : ""}" data-d="${k}" aria-label="Tanggal ${d}${est ? ", estimasi panen" : ""}${act ? ", sudah dipanen" : ""}">${d}</button>`;
  }
  const monthKeys = Object.keys(ev).filter(k => k.startsWith(`${y}-${pad(m + 1)}-`)).sort();
  const keys = sel ? (ev[sel] ? [sel] : []) : monthKeys;
  const rows = keys.flatMap(k => ev[k].map(e => ({ k, ...e })));
  const monthName = new Date(y, m, 1).toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  const s = sheet(`
    <div class="cal-head"><button class="cal-nav" id="cPrev" aria-label="Bulan sebelumnya">‹</button><h3>${monthName}</h3><button class="cal-nav" id="cNext" aria-label="Bulan berikutnya">›</button></div>
    <div class="cal-grid">${["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d => `<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
    <div class="cal-legend"><span><i class="sw est"></i>Estimasi panen</span><span><i class="sw act"></i>Sudah dipanen</span><span><i class="sw both"></i>Keduanya</span></div>
    <div class="section-title"><h3>${sel ? fmtDate(sel) : "Jadwal bulan ini"}</h3>${sel ? '<button class="btn small alt" id="cAll">Semua</button>' : ""}</div>
    ${rows.length ? rows.map(r => `<button class="proj" data-open="${r.p.id}"><div class="ico">${icon(r.p.tplId)}</div>
      <div class="body"><div class="name">${esc(r.p.name)}</div><div class="sub">${esc(r.label)}${sel ? "" : " · " + fmtDate(r.k)}</div></div></button>`).join("")
      : `<div class="empty">${sel ? "Tidak ada jadwal panen pada tanggal ini." : "Belum ada jadwal panen bulan ini. Mulai proyek dari tab Panduan agar estimasi panennya muncul."}</div>`}
    <div class="actions"><button class="btn alt" id="cX">Tutup</button></div>`);
  const go = (dy) => { const d = new Date(y, m + dy, 1); calSheet(d.getFullYear(), d.getMonth(), null); };
  s.querySelector("#cPrev").onclick = () => go(-1);
  s.querySelector("#cNext").onclick = () => go(1);
  s.querySelector("#cX").onclick = closeSheet;
  s.querySelector("#cAll")?.addEventListener("click", () => calSheet(y, m, null));
  s.querySelectorAll("[data-d]").forEach(b => b.onclick = () => calSheet(y, m, sel === b.dataset.d ? null : b.dataset.d));
  s.querySelectorAll("[data-open]").forEach(b => b.onclick = () => { closeSheet(); openId = b.dataset.open; watchLogs(openId); render(); window.scrollTo(0, 0); });
}

const PLAN_Q = [
  { k:"lokasi", q:"Di mana Anda akan berkebun?", o:[["balkon","Balkon / teras"],["pekarangan","Pekarangan"],["atap","Atap / dak"],["lahan","Lahan kebun"],["indoor","Dalam ruangan"]] },

  { k:"matahari", q:"Sinar matahari langsung per hari", o:[["tinggi","≥ 6 jam"],["sedang","3–6 jam"],["rendah","< 3 jam"]] },
  { k:"air", q:"Ketersediaan air", o:[["mudah","Mudah (kran / sumur)"],["terbatas","Terbatas"],["hujan","Hanya air hujan"]] },
  { k:"waktu", q:"Waktu merawat per hari", o:[["sedikit","< 15 menit"],["sedang","15–60 menit"],["banyak","> 1 jam"]] },
  { k:"modal", q:"Modal awal", o:[["kecil","Kecil (< Rp500 rb)"],["sedang","Sedang (Rp0,5–3 juta)"],["besar","Besar (> Rp3 juta)"]] },
  { k:"tujuan", q:"Tujuan utama", o:[["konsumsi","Konsumsi sendiri"],["jual","Dijual"],["hobi","Hobi / belajar"]] }
];
const PLAN_SCORE = {
  matahari:{ w:.3, v:{ tinggi:100, sedang:65, rendah:30 } }, air:{ w:.2, v:{ mudah:100, terbatas:55, hujan:35 } },
  waktu:{ w:.2, v:{ banyak:100, sedang:70, sedikit:40 } }, modal:{ w:.1, v:{ besar:100, sedang:70, kecil:45 } },
  tinggal:{ w:.2, v:{ milik:100, sewa:75, sementara:50, pindah:35 } }
};
function planScore(a){
  let sw = 0, t = 0, n = 0;
  for (const k in PLAN_SCORE) { const v = PLAN_SCORE[k].v[a[k]]; if (v != null) { sw += PLAN_SCORE[k].w; t += v * PLAN_SCORE[k].w; n++; } }
  return n >= 3 ? Math.round(t / sw) : null;
}
const SHADE_OK = ["bayam-hijau","selada-keriting","selada-air","sawi-keriting","sawi-putih","pakchoy","pakchoy-putih","sawi-pagoda","seledri","daun-bawang","parsley","selasih"];

function calcLayout(i){

    perTier = Math.floor(unitLen / pd) * Math.floor(depth / pd);

  } else if (i.mode === "lantai") {

async function saveLayout(){
  const d = layDraft, r = calcLayout(d); if (r.err) { toast(r.err); return; }

  const isNew = !layId, ref = isNew ? doc(anaCol()) : anaDoc(layId);

function wireGuideCards(root){
  root.querySelectorAll("[data-start]").forEach(b => b.onclick = () => startSheet(b.dataset.start));
  /* Ikon Step by Step / Alat / Bahan: satu panel per kartu. Panah di judul: buka semuanya, ketuk lagi untuk menutup semuanya. */
  const PANELS = { photo:".gphoto", gharvest:".gharvest", steps:".gsteps", gtools:".gtoolsbox", gbahan:".gbahan", gpred:".gpred" }, PNAMES = Object.keys(PANELS);
  function setPanels(card, next){
    PNAMES.forEach(n => card.querySelector(PANELS[n]).classList.toggle("hidden", !next.includes(n)));
    const all = next.length === PNAMES.length;
    card.classList.toggle("open", all);
    card.querySelector(".ctitle").setAttribute("aria-expanded", all);
    card.querySelector("[data-steps-btn]").setAttribute("aria-expanded", next.includes("steps"));
    card.querySelectorAll("[data-panel-btn]").forEach(x => x.setAttribute("aria-expanded", next.includes(x.dataset.panelBtn)));
    catOpen[card.dataset.id] = next.length ? next : null;
  }
  function showPanel(card, name){
    const open = PNAMES.filter(n => !card.querySelector(PANELS[n]).classList.contains("hidden"));
    if (name === "all") return setPanels(card, open.length === PNAMES.length ? [] : PNAMES);
    setPanels(card, open.length === 1 && open[0] === name ? [] : [name]);
  }
  let nameTap = { id: "", t: 0, prev: null };   /* ketuk 2x judul panduan = ubah nama langsung */
  root.querySelectorAll(".ctitle, .chevbtn").forEach(b => b.onclick = () => {
    const card = b.closest(".cat"), id = card.dataset.id;
    if (b.classList.contains("ctitle")) {
      if (nameTap.id === id && Date.now() - nameTap.t < 400) {
        const prev = nameTap.prev; nameTap = { id: "", t: 0, prev: null };
        setPanels(card, prev || []); editGuideName(card); return;   /* ketukan pertama sempat membuka/menutup panel: dikembalikan */
      }
      nameTap = { id, t: Date.now(), prev: catOpen[id] || [] };
    }
    showPanel(card, "all");
  });
  root.querySelectorAll("[data-media]").forEach(b => b.onclick = () => {
    catMedia[b.closest(".cat").dataset.id] = b.dataset.media;
    try { localStorage.setItem("essentera-media", JSON.stringify(catMedia)); } catch(e) {}
    rerenderKeep();
  });
  root.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => categorySheet(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-dup]").forEach(b => b.onclick = () => duplicateSheet(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-full]").forEach(b => b.onclick = () => openFull(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-star]").forEach(b => b.onclick = () => {
    const on = toggleStar(b.closest(".cat").dataset.id);
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    b.title = on ? "Sudah dicek kesesuaiannya (ketuk untuk batalkan)" : "Tandai sudah dicek kesesuaiannya";
    b.setAttribute("aria-label", on ? "Batalkan tanda sudah dicek" : "Tandai sudah dicek kesesuaiannya");
    if (starFilter !== "all" && view.querySelector("[data-sf]")) rerenderKeep();   /* panduan yang tak lagi cocok dengan filter keluar dari daftar */
  });
  root.querySelectorAll("[data-pin]").forEach(b => b.onclick = () => {
    const id = b.closest(".cat").dataset.id, on = togglePin(id);
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    const t = on ? "Lepas pin dari Dashboard" : "Pin ke Dashboard"; b.title = t; b.setAttribute("aria-label", t);
  });
  root.querySelectorAll("[data-delguide]").forEach(b => b.onclick = () => deleteGuide(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-photo-up]").forEach(b => b.onclick = () => pickGuidePhoto(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-photo-del]").forEach(b => b.onclick = () => deleteGuidePhoto(b.closest(".cat").dataset.id));
  root.querySelectorAll("[data-hv-add]").forEach(b => b.onclick = () => addHarvest(b.closest(".cat")));
  root.querySelectorAll(".gharvest .hvadd input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addHarvest(i.closest(".cat")); } });
  root.querySelectorAll("[data-hv-del]").forEach(b => b.onclick = () => deleteHarvest(b.closest(".cat").dataset.id, Number(b.dataset.hvDel)));
  root.querySelectorAll("[data-steps-btn]").forEach(b => b.onclick = () => showPanel(b.closest(".cat"), "steps"));

const lines = v => String(v || "").split("\n").map(x => x.trim()).filter(Boolean);
function editGuideName(card){
  const id = card.dataset.id, c = byId(id), h = card.querySelector("h3"), ct = h && h.querySelector(".ctitle");
  if (!c || !ct || h.querySelector(".gnameedit")) return;
  const inp = document.createElement("input");
  inp.className = "gnameedit"; inp.value = c.name; inp.maxLength = 60; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Nama panduan");
  let done = false;
  const nm = ct.lastElementChild;   /* hanya teks nama yang diganti; ikon tetap di tempatnya */
  const cancel = () => { if (done) return; done = true; inp.remove(); nm.style.display = ""; ct.style.flex = ""; };
  const commit = () => {
    if (done) return;
    const name = inp.value.trim().replace(/\s+/g, " ");
    if (!name || name === c.name) return cancel();
    done = true; saveGuide(id, { name });
  };

}
function saveGuide(id, patch, mk){
  if (mk && mk !== "tanah") {   /* edit untuk media non-tanah disimpan di bawah media.<nama media> */
    const old = guideEdits[id] || {}, om = old.media || {};
    guideEdits[id] = { ...old, media: { ...om, [mk]: { ...(om[mk] || {}), ...patch } } };
    patch = { media: { [mk]: patch } };
  } else guideEdits[id] = { ...(guideEdits[id] || {}), ...patch };
  applyEdits();
  toast("Perubahan disimpan."); render();
  setDoc(doc(db, "users", user.uid, "guides", id), { ...patch, updatedAt: serverTimestamp() }, { merge: true }).catch(e => toast(errMsg(e)));
}

function saveCats(){ setDoc(doc(db, "users", user.uid, "meta", "categories"), { list: customCats, renames: catRename, hidden: catHidden, order: catOrder, updatedAt: serverTimestamp() }).catch(e => toast(errMsg(e))); }
/* Atur kategori: ubah nama, hapus, tambah, dan pulihkan kategori bawaan. Perubahan disimpan saat menekan Simpan. */
/* Ganti nama kategori langsung di chip-nya (ketuk dua kali): Enter / ketuk di luar = simpan, Esc = batal. */
let catTap = { id: "", t: 0, block: 0 };
/* Geser chip kategori kiri/kanan untuk mengubah urutan (dimulai dari ketukan kedua). Lepas tanpa geser = ganti nama. */
function dragChip(b, e, fbar){
  const chips = [...fbar.querySelectorAll("button[data-f]")].filter(x => x.dataset.f !== "none");
  const from = chips.indexOf(b); if (from < 0) { b._armed = false; return; }
  const fr = fbar.getBoundingClientRect();
  const L = chips.map(x => x.getBoundingClientRect().left - fr.left + fbar.scrollLeft), W = chips.map(x => x.offsetWidth);
  const gap = chips.length > 1 ? Math.max(0, L[1] - (L[0] + W[0])) : 8;
  const pid = e.pointerId, startX = e.clientX, startSL = fbar.scrollLeft;
  let cx = e.clientX, moved = false, to = from, done = false, raf = 0;
  try { b.setPointerCapture(pid); } catch (_) {}
  const update = () => {
    const dx = (cx - startX) + (fbar.scrollLeft - startSL);
    if (!moved && Math.abs(dx) < 6) return;
    if (!moved) { moved = true; b.classList.add("dragging"); }
    const last = chips.length - 1;
    const d = Math.max(L[0] - L[from], Math.min(L[last] + W[last] - (L[from] + W[from]), dx));
    b.style.transform = `translateX(${d}px)`;
    const c = L[from] + d + W[from] / 2;
    to = 0; chips.forEach((_, i) => { if (i !== from && L[i] + W[i] / 2 < c) to++; });
    chips.forEach((el, i) => { if (i === from) return;
      el.style.transform = (from < to && i > from && i <= to) ? `translateX(${-(W[from] + gap)}px)` : (from > to && i >= to && i < from) ? `translateX(${W[from] + gap}px)` : ""; });
  };
  const tick = () => {
    if (done) return;
    if (moved) { if (cx < fr.left + 36) fbar.scrollLeft -= 8; else if (cx > fr.right - 36) fbar.scrollLeft += 8; }
    update(); raf = requestAnimationFrame(tick);
  };
  tick();
  const onMove = ev => { if (ev.pointerId === pid) cx = ev.clientX; };
  const finish = ev => {
    if (ev.pointerId !== pid || done) return;
    done = true; cancelAnimationFrame(raf); b._armed = false;
    b.removeEventListener("pointermove", onMove); b.removeEventListener("pointerup", finish); b.removeEventListener("pointercancel", finish);
    catTap.block = Date.now() + 500;   /* klik susulan setelah geser tidak dianggap ketukan baru */
    if (!moved) { if (ev.type === "pointerup") b._renameOnClick = true; return; }
    if (ev.type === "pointerup" && to !== from) {
      const ids = chips.map(x => x.dataset.f); const [m] = ids.splice(from, 1); ids.splice(to, 0, m);
      catOrder = ids; saveCats(); applyEdits(); toast("Urutan kategori diubah.");
    }
    const sl = fbar.scrollLeft; render();
    const f = view.querySelector(".filters"); if (f) f.scrollLeft = sl;
  };
  b.addEventListener("pointermove", onMove); b.addEventListener("pointerup", finish); b.addEventListener("pointercancel", finish);
}
function renameCatInline(btn, id){
  const k = allCats().find(x => x.id === id); if (!k) return;
  const wrap = document.createElement("span"); wrap.className = "catedwrap";
  const inp = document.createElement("input");
  inp.className = "catedit"; inp.value = k.name; inp.maxLength = 24; inp.autocomplete = "off"; inp.setAttribute("aria-label", "Nama kategori");
  inp.style.width = Math.max(90, btn.offsetWidth - 14) + "px";
  const del = document.createElement("button");
  del.className = "catdel"; del.type = "button"; del.setAttribute("aria-label", "Hapus kategori"); del.title = "Hapus kategori";
  del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
  wrap.append(inp, del);
  btn.replaceWith(wrap); inp.focus(); inp.select();
  let finished = false, deleting = false;
  const cancel = () => { if (finished) return; finished = true; render(); };
  const save = () => {
    if (finished) return;
    const name = inp.value.trim();
    if (name === k.name) { cancel(); return; }
    if (!name) { toast("Nama kategori tidak boleh kosong."); return false; }
    if (allCats().some(x => x.id !== id && x.name.trim().toLowerCase() === name.toLowerCase())) { toast(`Nama "${name}" sudah dipakai.`); return false; }
    finished = true;
    if (isBuiltinCat(id)) { if (name === CATS[id]) delete catRename[id]; else catRename[id] = name; }
    else customCats = customCats.map(x => x.id === id ? { ...x, name } : x);
    saveCats(); applyEdits(); toast("Nama kategori diubah."); render();
  };
  del.addEventListener("pointerdown", () => { deleting = true; });   /* terjadi sebelum blur, supaya blur tidak menutup kotak lebih dulu */
  del.addEventListener("click", () => {
    if (!confirm(`Hapus kategori "${k.name}"? Panduan di dalamnya tidak ikut terhapus, hanya menjadi "Tanpa kategori" atau kembali ke kategori asalnya.`)) { deleting = false; inp.focus(); return; }
    finished = true;
    if (isBuiltinCat(id)) { if (!catHidden.includes(id)) catHidden = [...catHidden, id]; delete catRename[id]; }
    else customCats = customCats.filter(x => x.id !== id);
    catOrder = catOrder.filter(x => x !== id);
    if (catFilter === id) catFilter = "all";
    saveCats(); applyEdits(); toast("Kategori dihapus."); render();
  });
  inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); save(); } else if (e.key === "Escape") cancel(); });
  inp.addEventListener("blur", () => { if (deleting) return; if (save() === false) cancel(); });
}

function catSheet(){
  let rows = allCats().map(k => ({ id: k.id, name: k.name })), hid = [...catHidden];
  const s = sheet(`<h3>Atur kategori</h3>
    <p class="muted">Ubah nama langsung di kolom, tahan ikon titik di kiri lalu geser untuk mengurutkan, ketuk silang untuk menghapus. Panduan dalam kategori yang dihapus kembali ke kategori asalnya, atau menjadi "Tanpa kategori".</p>
    <div id="kRows"></div>
    <label for="kName">Tambah kategori baru</label><input id="kName" maxlength="24" placeholder="Contoh: Buah, Tanaman hias">
    <div id="kHid"></div>
    <div class="actions"><button class="btn alt" id="x">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  const box = s.querySelector("#kRows"), hbox = s.querySelector("#kHid");
  const collect = () => { box.querySelectorAll(".k-n").forEach((i, n) => { if (rows[n]) rows[n].name = i.value; }); };
  const draw = () => {
    box.innerHTML = rows.length ? rows.map((r, i) => `<div class="inrow krow"><button class="grip" data-grip="${i}" aria-label="Geser untuk mengurutkan" title="Tahan lalu geser (atau panah atas/bawah)"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.5"/><circle cx="15" cy="6" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="18" r="1.5"/><circle cx="15" cy="18" r="1.5"/></svg></button><input class="k-n" maxlength="24" value="${esc(r.name)}" aria-label="Nama kategori"><button class="pedit x" data-rm="${i}" aria-label="Hapus kategori" title="Hapus kategori">${IC_X}</button></div>`).join("")
      : `<p class="empty">Belum ada kategori. Tambahkan di bawah.</p>`;
    hbox.innerHTML = hid.length ? `<label>Kategori bawaan yang dihapus</label>${hid.map(id => `<div class="inrow"><span style="flex:1;min-width:0">${esc(CATS[id])}</span><button class="btn small alt" data-restore="${id}">Pulihkan</button></div>`).join("")}` : "";
    box.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
      collect(); const r = rows[Number(b.dataset.rm)];
      if (!confirm(`Hapus kategori "${r.name}"?`)) return;
      rows.splice(Number(b.dataset.rm), 1); if (isBuiltinCat(r.id)) hid.push(r.id); draw();
    });
    box.querySelectorAll("[data-grip]").forEach(g => {
      const from = Number(g.dataset.grip);
      g.onpointerdown = e => {
        e.preventDefault(); collect();
        const els = [...box.querySelectorAll(".krow")], n = els.length; if (n < 2) return;
        const stride = els[1].getBoundingClientRect().top - els[0].getBoundingClientRect().top || els[0].offsetHeight;
        const startY = e.clientY; let to = from; els[from].classList.add("drag"); g.setPointerCapture(e.pointerId);
        g.onpointermove = ev => {
          const dy = Math.max(-from * stride, Math.min((n - 1 - from) * stride, ev.clientY - startY));
          els[from].style.transform = `translateY(${dy}px)`;
          to = Math.max(0, Math.min(n - 1, Math.round(from + dy / stride)));
          els.forEach((el, i) => { if (i !== from) el.style.transform = (from < to && i > from && i <= to) ? `translateY(${-stride}px)` : (from > to && i >= to && i < from) ? `translateY(${stride}px)` : ""; });
        };
        const end = () => { g.onpointermove = g.onpointerup = g.onpointercancel = null; if (to !== from) { const [m] = rows.splice(from, 1); rows.splice(to, 0, m); } draw(); };
        g.onpointerup = g.onpointercancel = end;
      };
      g.onkeydown = e => {
        const to = from + (e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0);
        if (to === from || to < 0 || to >= rows.length) return;
        e.preventDefault(); collect(); const [m] = rows.splice(from, 1); rows.splice(to, 0, m); draw(); box.querySelector(`[data-grip="${to}"]`)?.focus();
      };
    });
    hbox.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => { collect(); const id = b.dataset.restore; hid = hid.filter(x => x !== id); rows.push({ id, name: CATS[id] }); draw(); });
  };
  draw();
  s.querySelector("#x").onclick = closeSheet;
  const save = () => {
    collect();
    const nk = s.querySelector("#kName").value.trim();
    const all = rows.map(r => ({ ...r, name: r.name.trim() }));
    if (all.some(r => !r.name)) { toast("Nama kategori tidak boleh kosong."); return; }
    if (nk) all.push({ id: "k_" + Date.now().toString(36), name: nk });
    const seen = new Set();
    for (const r of all) { const k = r.name.toLowerCase(); if (seen.has(k)) { toast(`Nama "${r.name}" dipakai dua kali.`); return; } seen.add(k); }
    customCats = all.filter(r => !isBuiltinCat(r.id));
    catRename = {}; all.forEach(r => { if (isBuiltinCat(r.id) && r.name !== CATS[r.id]) catRename[r.id] = r.name; });
    catHidden = hid.filter(isBuiltinCat);
    catOrder = all.map(r => r.id);
    if (nk) catFilter = all[all.length - 1].id;
    saveCats(); applyEdits(); closeSheet(); toast("Kategori disimpan."); render();
  };
  s.querySelector("#ok").onclick = save;
  s.querySelector("#kName").addEventListener("keydown", e => { if (e.key === "Enter") save(); });
}

function normHarv(a){ return (Array.isArray(a) ? a : []).map(x => ({ g: Math.max(0, Number(x && x.g) || 0), d: /^\d{4}-\d{2}-\d{2}$/.test(x && x.d) ? x.d : "" })).filter(x => x.g > 0); }

const harvTotal = a => a.reduce((t, x) => t + x.g, 0);

function renderDetail(p){
  const stages = p.stages || byId(p.tplId)?.stages || [];
  const tpl = byId(p.tplId);
  const pr = progressOf(p); const cur = currentStage(p); const d = Math.max(0, daysSince(p.startDate));
  const items = logs[p.id]?.items || [];
  const totalDays = p.days || tpl?.days || stages[stages.length - 1]?.day || 1;
  const fillPct = stages.length > 1 ? Math.min(100, Math.round(cur / (stages.length - 1) * 100)) : 0;
  const harvest = p.harvest || [];
  const hSum = harvest.reduce((n, h) => n + Number(h.qty || 0), 0);

  view.innerHTML = `
    <div class="dh"><h2><span class="ico sm">${icon(p.tplId)}</span>${esc(p.name)}</h2>
      <div class="row"><span class="muted">Mulai ${fmtDate(p.startDate)}</span>${p.media && MEDIA[p.media] ? `<span class="chip">${MEDIA[p.media]}</span>` : ""}${p.completed ? '<span class="chip done">Selesai</span>' : `<span class="chip">Hari ke-${d + 1}</span>`}</div>
      ${p.note ? `<p class="muted" style="margin-top:.4rem">${esc(p.note)}</p>` : ""}</div>
    <div class="bigprog"><div class="num">${pr.pct}%</div><div class="muted">${pr.done} dari ${pr.total} tugas selesai · perkiraan ${totalDays} hari</div>
      <div class="bar"><i style="width:${pr.pct}%"></i></div></div>

    <div class="stem"><div class="fill" style="height:calc(${fillPct}% - 6px)"></div>
    ${stages.map((s, i) => {
      const keys = s.t.map((_, j) => `${i}_${j}`);
      const allDone = keys.every(k => p.done?.[k]);
      const cls = ["stage", allDone ? "done" : "", i === cur && !allDone ? "now" : "", s.type === "harvest" ? "harvest" : ""].join(" ");
      return `<div class="${cls}"><div class="node" aria-hidden="true"></div>
        <h3>${esc(s.n)}${i === cur && !allDone && !p.completed ? '<span class="chip">Sekarang</span>' : ""}</h3>
        <div class="when">Hari ke-${s.day + 1} · ${fmtDate(addDays(p.startDate, s.day))}</div>
        ${s.d ? `<div class="desc">${esc(s.d)}</div>` : ""}
        <div class="tasks">${s.t.map((t, j) => `<label class="task ${p.done?.[i + "_" + j] ? "done" : ""}" style="margin:0"><input type="checkbox" data-k="${i}_${j}" ${p.done?.[i + "_" + j] ? "checked" : ""}><span>${esc(t)}</span></label>`).join("")}</div>
        ${s.type === "harvest" ? `<button class="btn small" style="margin-top:.5rem" data-harvest>+ Catat panen</button>` : ""}
      </div>`; }).join("")}</div>

    ${harvest.length ? `<div class="section-title"><h3>Hasil panen</h3><span class="muted">Total ${hSum} ${esc(p.unit || "")}</span></div>
      ${harvest.map((h, i) => `<div class="log"><div class="d"><span>${fmtDate(h.date)}</span><button data-delh="${i}" class="muted">Hapus</button></div><div class="t"><b>${esc(h.qty)} ${esc(p.unit || "")}</b>${h.note ? " — " + esc(h.note) : ""}</div></div>`).join("")}` : ""}

    <div class="section-title"><h3>Jurnal & foto</h3><button class="btn small" id="btnLog">+ Catatan</button></div>
    ${items.length ? items.map(l => `<div class="log"><div class="d"><span>${fmtDate(l.date)}</span><button data-dell="${l.id}" class="muted">Hapus</button></div>
      ${l.text ? `<div class="t">${esc(l.text)}</div>` : ""}${l.photo ? `<img src="${esc(l.photo)}" alt="Foto jurnal" loading="lazy">` : ""}</div>`).join("")
      : `<div class="empty">Belum ada catatan. Foto tiap perkembangan membantu Anda belajar di siklus berikutnya.</div>`}

    <div style="display:flex;gap:.6rem;margin-top:1.4rem;flex-wrap:wrap">
      ${p.completed ? `<button class="btn alt" id="btnReopen">Buka kembali</button>` : `<button class="btn" id="btnFinish">Tandai selesai</button>`}
      <button class="btn danger" id="btnDel">Hapus proyek</button></div>`;

  const pref = doc(db, "users", user.uid, "projects", p.id);
  view.querySelectorAll("input[data-k]").forEach(c => c.onchange = () => updateDoc(pref, { ["done." + c.dataset.k]: c.checked }).catch(e => toast(errMsg(e))));
  view.querySelector("[data-harvest]")?.addEventListener("click", () => harvestSheet(p));
  view.querySelectorAll("[data-delh]").forEach(b => b.onclick = () => { if (confirm("Hapus catatan panen ini?")) { const h = [...harvest]; h.splice(Number(b.dataset.delh), 1); updateDoc(pref, { harvest: h }).catch(e => toast(errMsg(e))); } });
  $("#btnLog").onclick = () => logSheet(p);
  view.querySelectorAll("[data-dell]").forEach(b => b.onclick = async () => {
    if (!confirm("Hapus catatan ini?")) return;
    const l = items.find(x => x.id === b.dataset.dell);
    try { await deleteDoc(doc(db, "users", user.uid, "projects", p.id, "logs", l.id)); if (l.photoPath) deleteObject(sRef(storage, l.photoPath)).catch(() => {}); } catch(e){ toast(errMsg(e)); }
  });
  $("#btnFinish")?.addEventListener("click", () => updateDoc(pref, { completed: true }).then(() => toast("Proyek selesai. Selamat!")).catch(e => toast(errMsg(e))));
  $("#btnReopen")?.addEventListener("click", () => updateDoc(pref, { completed: false }).catch(e => toast(errMsg(e))));
  $("#btnDel").onclick = () => deleteProject(p);
}

function harvestSheet(p){
  const s = sheet(`<h3>Catat panen</h3>
    <div class="two"><div><label for="hQ">Jumlah (${esc(p.unit || "")})</label><input id="hQ" type="number" inputmode="decimal" min="0" step="any"></div>
    <div><label for="hD">Tanggal</label><input id="hD" type="date" value="${today()}"></div></div>
    <label for="hN">Catatan (kualitas, rasa, ukuran)</label><textarea id="hN"></textarea>
    <div class="actions"><button class="btn alt" id="x">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  s.querySelector("#x").onclick = closeSheet;
  s.querySelector("#ok").onclick = async () => {
    const qty = s.querySelector("#hQ").value; if (qty === "") { toast("Isi jumlah panen."); return; }
    const h = [...(p.harvest || []), { qty: Number(qty), date: s.querySelector("#hD").value || today(), note: s.querySelector("#hN").value.trim() }];
    h.sort((a, b) => b.date.localeCompare(a.date));
    try { await updateDoc(doc(db, "users", user.uid, "projects", p.id), { harvest: h }); closeSheet(); toast("Panen tercatat."); } catch(e){ toast(errMsg(e)); }
  };
}

/* Foto: kompres di perangkat. Utamanya ke Firebase Storage; jika Storage belum aktif, jatuh ke versi kecil di Firestore. */
function compress(file, max, quality){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error("Gagal memproses foto.")), "image/jpeg", quality);
    };
    img.onerror = () => rej(new Error("File bukan gambar yang valid.")); img.src = url;
  });
}
const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
/* Simpan foto dengan urutan: (1) Firebase Storage bila online, dibatasi waktu agar tidak menggantung;
   (2) bila offline, Storage belum aktif, atau lambat: versi kecil (data URL) yang disimpan langsung di browser
   lewat cache Firestore dan otomatis tersinkron saat online. Foto selalu bisa diunggah dan langsung tampil. */
async function storePhoto(file, path){
  if (navigator.onLine) {
    try {
      const blob = await compress(file, 1280, 0.78), r = sRef(storage, path);
      await withTimeout(uploadBytes(r, blob, { contentType: "image/jpeg" }), 15000);
      return { photo: await withTimeout(getDownloadURL(r), 10000), photoPath: path, local: false };
    } catch (e) { /* lanjut ke penyimpanan lokal */ }
  }
  return { photo: await blobToDataUrl(await compress(file, 640, 0.6)), photoPath: null, local: true };
}

function logSheet(p){
  const s = sheet(`<h3>Catatan baru</h3>
    <label for="lD">Tanggal</label><input id="lD" type="date" value="${today()}">
    <label for="lT">Catatan perkembangan</label><textarea id="lT" placeholder="Misal: daun mulai menguning, sudah diberi POC"></textarea>
    <label for="lF">Foto (opsional)</label><input id="lF" type="file" accept="image/*" capture="environment">
    <div class="actions"><button class="btn alt" id="x">Batal</button><button class="btn" id="ok">Simpan</button></div>`);
  s.querySelector("#x").onclick = closeSheet;
  s.querySelector("#ok").onclick = async (ev) => {
    const text = s.querySelector("#lT").value.trim(), file = s.querySelector("#lF").files[0];
    if (!text && !file) { toast("Isi catatan atau pilih foto."); return; }
    ev.target.disabled = true; ev.target.textContent = "Menyimpan…";
    const data = { date: s.querySelector("#lD").value || today(), text, createdAt: serverTimestamp() };
    try {
      let local = false;
      if (file) {
        const res = await storePhoto(file, `users/${user.uid}/${p.id}/${Date.now()}.jpg`);
        data.photo = res.photo; data.photoPath = res.photoPath; local = res.local;
      }
      /* tidak ditunggu: saat offline, Firestore menyimpan di cache lokal dan menyinkronkan nanti */
      addDoc(collection(db, "users", user.uid, "projects", p.id, "logs"), data).catch(e => toast(errMsg(e)));
      closeSheet(); toast(local ? "Catatan dan foto tersimpan di perangkat, akan tersinkron saat online." : "Catatan disimpan.");
    } catch(e){ toast(errMsg(e)); ev.target.disabled = false; ev.target.textContent = "Simpan"; }
  };
}

/* ---------------- SETTING ---------------- */
const FONT_SIZES = [{ k:90, l:"Kecil" }, { k:100, l:"Normal" }, { k:115, l:"Besar" }, { k:130, l:"Sangat besar" }];
function fontPct(){ try { const v = parseInt(localStorage.getItem("essentera-fs"), 10); return FONT_SIZES.some(f => f.k === v) ? v : 100; } catch(e){ return 100; } }
function setFontSize(k){ document.documentElement.style.fontSize = k + "%"; try { localStorage.setItem("essentera-fs", String(k)); } catch(e){} }
const RELEASE_DATE = "2026-10-13";
function releaseAge(){
  const r = new Date(RELEASE_DATE + "T00:00:00"), n = new Date();
  const days = Math.floor((n - r) / DAY);
  if (days < 1) return "Baru dirilis hari ini";
  let months = (n.getFullYear() - r.getFullYear()) * 12 + (n.getMonth() - r.getMonth()) - (n.getDate() < r.getDate() ? 1 : 0);
  if (months < 1) return days + " hari";
  if (months < 12) return months + " bulan";
  const y = Math.floor(months / 12), mo = months % 12;
  return y + " tahun" + (mo ? " " + mo + " bulan" : "");
}

  view.innerHTML = `

        <button data-theme-set="light" class="${m === "light" ? "on" : ""}">Terang</button>
        <button data-theme-set="dark" class="${m === "dark" ? "on" : ""}">Gelap</button></div></div>
    <div class="cat"><h3>Ukuran huruf</h3><p>Atur ukuran teks agar nyaman dibaca.</p>
      <div class="seg" role="group" aria-label="Ukuran huruf">
        ${FONT_SIZES.map(f => `<button data-fs-set="${f.k}" class="${fontPct() === f.k ? "on" : ""}">${f.l}</button>`).join("")}</div>
      <div class="fs-preview">Contoh: Kangkung siap dipanen pada hari ke-26. Potong 5 cm di atas tanah agar tumbuh lagi.</div></div>
    <div class="cat"><h3>Akun</h3><p>${esc(user.displayName ? user.displayName + " · " : "")}${esc(user.email || "")}</p>
      <p>Data Anda tersimpan di akun ini dan hanya bisa dibaca oleh Anda. Aplikasi tetap bisa dibuka tanpa internet; perubahan akan tersinkron saat online.</p>
      <button class="btn alt" id="btnOut">Keluar</button></div>
    <div class="cat"><h3>Tentang Essentera</h3>
      <p>Essentera adalah aplikasi hidup berkelanjutan (sustainable living) yang berfokus pada kemandirian pangan dan energi. Tujuannya mengurangi ketergantungan pada pihak luar dan membangun kebiasaan berdikari dari rumah sendiri.</p>
      <p>Aplikasi ini memandu Anda langkah demi langkah merawat tanaman, beternak, dan mengelola energi, lengkap dengan progres dari awal tanam sampai panen dan pengolahan, serta jurnal foto untuk mencatat perkembangan.</p>
      <div class="about">
        <div><span>Tanggal rilis</span><b>${fmtDate(RELEASE_DATE)}</b></div>
        <div><span>Masa rilis</span><b>${releaseAge()}</b></div>
      </div></div>
    <p class="muted" style="text-align:center;margin-top:1rem">Essentera · hidup berkelanjutan dan berdikari</p>`;
  view.querySelectorAll("[data-fs-set]").forEach(b => b.onclick = () => { setFontSize(Number(b.dataset.fsSet)); render(); });
  view.querySelectorAll("[data-theme-set]").forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); render(); });
  $("#btnOut").onclick = () => signOut(auth);

/* ---------------- TEMA GELAP / TERANG ---------------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => { const t = document.documentElement.dataset.theme; return t ? t === "dark" : sysDark.matches; };
function paintTheme(){
  const dark = isDark(), b = $("#btnTheme");
  b.innerHTML = dark ? SUN : MOON;
  b.setAttribute("aria-label", dark ? "Ganti ke mode terang" : "Ganti ke mode gelap");
  b.title = dark ? "Mode terang" : "Mode gelap";
  document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#121c15" : "#2f4a35");
}
const themeMode = () => document.documentElement.dataset.theme || "system";
function setTheme(mode){
  if (mode === "system") { delete document.documentElement.dataset.theme; try { localStorage.removeItem("essentera-theme"); } catch(e) {} }
  else { document.documentElement.dataset.theme = mode; try { localStorage.setItem("essentera-theme", mode); } catch(e) {} }
  paintTheme();
}
$("#btnTheme").onclick = () => { setTheme(isDark() ? "light" : "dark"); if (tab === "settings" && !openId) render(); };
sysDark.addEventListener?.("change", paintTheme);
paintTheme();

/* ---------------- PWA & JARINGAN ---------------- */
const netBadge = $("#netBadge");
const updNet = () => netBadge.classList.toggle("hidden", navigator.onLine);
addEventListener("resize", () => document.documentElement.style.setProperty("--hdr", ($("header.top")?.offsetHeight || 70) + "px"));
addEventListener("online", updNet); addEventListener("offline", updNet); updNet();
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("service-worker.js").catch(() => {}));
</script>
